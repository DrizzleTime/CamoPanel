services:
  camopanel:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAMO_ADDR: "0.0.0.0:8080"
      DOCKER_MODE: "demo"
      CAMO_ADMIN_USERNAME: "${CAMO_ADMIN_USERNAME:-admin}"
      CAMO_ADMIN_PASSWORD: "${CAMO_ADMIN_PASSWORD:?请在 .env 中设置 CAMO_ADMIN_PASSWORD}"
      CAMO_API_TOKEN: "${CAMO_API_TOKEN:-}"
    restart: unless-stopped
